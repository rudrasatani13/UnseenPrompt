name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  APP_ENV: test
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  RELEASE_SHA: test
  MAINTENANCE_MODE: "off"
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy_000000000000
  PNPM_VERSION: 11.17.0
  NODE_VERSION: 24

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Run unit tests
        run: pnpm test:unit
      - name: Run copy policy tests
        run: pnpm test:copy
      - name: Run browser tests
        run: pnpm test:e2e
      - name: Run maintenance browser tests
        run: pnpm test:e2e:maintenance
      - name: Run production-guard browser tests
        run: pnpm test:e2e:production
      - name: Build Next.js
        run: pnpm build
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  phase7-browser:
    name: Phase 7 deterministic browser gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # These are non-secret parser fixtures. The browser test intercepts every provider-bound
      # command, so no value is a usable provider credential or sent off-host.
      MODEL_PRIMARY_PROVIDER: anthropic
      MODEL_PRIMARY_MODEL: phase7-e2e-fixture
      MODEL_PRIMARY_INPUT_COST_MICROS_PER_MILLION_TOKENS: "0"
      MODEL_PRIMARY_OUTPUT_COST_MICROS_PER_MILLION_TOKENS: "0"
      MODEL_FALLBACK_PROVIDER: openai
      MODEL_FALLBACK_MODEL: phase7-e2e-fallback
      MODEL_FALLBACK_INPUT_COST_MICROS_PER_MILLION_TOKENS: "0"
      MODEL_FALLBACK_OUTPUT_COST_MICROS_PER_MILLION_TOKENS: "0"
      ANTHROPIC_API_KEY: ci-placeholder-not-a-provider-credential
      OPENAI_API_KEY: ci-placeholder-not-a-provider-credential
      E2E_PHASE7_STORAGE_STATE: ${{ runner.temp }}/phase7-auth-state.json
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start isolated Supabase stack
        run: pnpm exec supabase start
      - name: Reset isolated database
        run: pnpm exec supabase db reset --yes
      - name: Export isolated Supabase credentials without logging them
        shell: bash
        run: |
          status_file="$(mktemp)"
          trap 'rm -f "$status_file"' EXIT
          pnpm exec supabase status -o env > "$status_file"

          set -a
          source "$status_file"
          set +a

          api_url="${API_URL:-}"
          publishable_key="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          service_role_key="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          test -n "$api_url"
          test -n "$publishable_key"
          test -n "$service_role_key"

          {
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$api_url"
            printf 'SUPABASE_AUTH_TEST_URL=%s\n' "$api_url"
            printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$publishable_key"
            printf 'SUPABASE_AUTH_TEST_PUBLISHABLE_KEY=%s\n' "$publishable_key"
            printf 'SUPABASE_AUTH_TEST_SERVICE_ROLE_KEY=%s\n' "$service_role_key"
          } >> "$GITHUB_ENV"
      - name: Seed ephemeral auth and abandoned discovery fixture
        run: pnpm exec tsx tests/e2e/phase7-setup.ts
      - name: Run deterministic Phase 7 browser test
        env:
          E2E_PHASE7_MOCK: on
          E2E_AUTH_STORAGE_STATE: ${{ runner.temp }}/phase7-auth-state.json
          E2E_APP_ENV: test
          E2E_PORT: "3200"
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3200
        run: pnpm exec playwright test tests/e2e/discovery-mock.spec.ts --project=phase7-mock
      - name: Stop isolated Supabase stack
        if: always()
        run: pnpm exec supabase stop --no-backup

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start isolated Supabase stack
        run: pnpm exec supabase start
      - name: Reset database from migrations and seed
        run: pnpm exec supabase db reset --yes
      - name: Lint database schema
        run: pnpm db:lint
      - name: Run database tests
        run: pnpm test:db
      - name: Export isolated Supabase API credentials for authorization tests
        shell: bash
        run: |
          status_file="$(mktemp)"
          trap 'rm -f "$status_file"' EXIT
          pnpm exec supabase status -o env > "$status_file"

          set -a
          # The isolated local CLI emits shell-quoted assignments; sourcing preserves exact values.
          # No value is echoed, and the temporary file is removed when this step exits.
          source "$status_file"
          set +a

          api_url="${API_URL:-}"
          publishable_key="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          service_role_key="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"

          test -n "$api_url"
          test -n "$publishable_key"
          test -n "$service_role_key"

          {
            printf 'SUPABASE_AUTH_TEST_URL=%s\n' "$api_url"
            printf 'SUPABASE_AUTH_TEST_PUBLISHABLE_KEY=%s\n' "$publishable_key"
            printf 'SUPABASE_AUTH_TEST_SERVICE_ROLE_KEY=%s\n' "$service_role_key"
          } >> "$GITHUB_ENV"
      - name: Run database integration tests
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm test:db:concurrency
      - name: Check generated database types
        run: pnpm db:types:check
      - name: Stop isolated test database
        if: always()
        run: pnpm exec supabase stop --no-backup

  cloudflare-preview:
    name: Cloudflare Preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check generated Cloudflare types
        run: pnpm cf:types:check
      - name: Check Workers dependency policy
        run: pnpm check:workers-deps
      - name: Build Workers bundle
        run: pnpm cf:build
      - name: Assert bundle entry point
        run: test -f .open-next/worker.js
      - name: Smoke-test Workers preview
        run: pnpm test:cf-preview
