name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  APP_ENV: test
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  RELEASE_SHA: test
  PNPM_VERSION: 11.17.0
  NODE_VERSION: 24

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Run unit tests
        run: pnpm test:unit
      - name: Build Next.js
        run: pnpm build

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start isolated test database
        run: pnpm exec supabase db start
      - name: Run database tests
        run: pnpm test:db
      - name: Stop isolated test database
        if: always()
        run: pnpm exec supabase stop --no-backup

  cloudflare-preview:
    name: Cloudflare Preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check generated Cloudflare types
        run: pnpm cf:types:check
      - name: Check Workers dependency policy
        run: pnpm check:workers-deps
      - name: Build Workers bundle
        run: pnpm cf:build
      - name: Assert bundle entry point
        run: test -f .open-next/worker.js
      - name: Smoke-test Workers preview
        run: pnpm test:cf-preview
