name: Deploy Preview

on:
  workflow_run:
    workflows: [Build Preview Artifact]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: preview-${{ github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      APP_ENV: preview
      NEXT_PUBLIC_APP_URL: https://preview.unseenprompt.com
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      PR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      NODE_VERSION: 24
      PNPM_VERSION: 11.17.0
    steps:
      - name: Check out trusted main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION}
      - name: Install trusted dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Assert preview Worker has no secret bindings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PREVIEW_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
          STAGING_CLOUDFLARE_ACCOUNT_ID: ${{ vars.STAGING_CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_CLOUDFLARE_ACCOUNT_ID: ${{ vars.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/assert-preview-secret-isolation.mjs
      - name: Download preview Worker artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-worker-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: preview-artifact
      - name: Extract preview Worker artifact
        env:
          PREVIEW_EXTRACT_DIR: ${{ runner.temp }}/preview-worker
        run: |
          python3 scripts/extract-preview-artifact.py \
            preview-artifact/preview-worker.tar "$PREVIEW_EXTRACT_DIR"
          test ! -e .open-next
          mv "$PREVIEW_EXTRACT_DIR/.open-next" .open-next
      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PREVIEW_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: >-
          pnpm exec wrangler versions upload
          --env preview
          --strict
          --preview-alias pr-${{ env.PR_NUMBER }}
          --tag ${{ env.PR_HEAD_SHA }}
          --message "PR ${{ env.PR_NUMBER }}"
          --var RELEASE_SHA:${{ env.PR_HEAD_SHA }}
      - name: Resolve preview URL
        id: preview
        env:
          OUTPUT_FILE: ${{ runner.temp }}/wrangler-output.ndjson
        run: node scripts/wrangler-output.mjs preview-url
      - name: Smoke-test preview
        env:
          DEPLOYMENT_URL: ${{ steps.preview.outputs.url }}
          GITHUB_SHA: ${{ env.PR_HEAD_SHA }}
        run: pnpm test:cf-deployment
