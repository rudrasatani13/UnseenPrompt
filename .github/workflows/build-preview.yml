name: Build Preview Artifact

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: build-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      APP_ENV: preview
      NEXT_PUBLIC_APP_URL: https://preview.unseenprompt.com
      RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
      NODE_VERSION: 24
      PNPM_VERSION: 11.17.0
    steps:
      - name: Check out pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Worker
        run: pnpm cf:build
      - name: Package preview Worker
        run: >-
          tar --dereference --hard-dereference
          --create --file preview-worker.tar .open-next
      - name: Upload preview Worker
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-worker-${{ github.run_id }}
          path: preview-worker.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
